<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Space Insurer — Mutual of Andromeda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
/* ============================================================
   DESIGN TOKENS
   ============================================================ */
:root {
  --bg:        #07111e;
  --panel:     #0d1e32;
  --card:      #1c3553;
  --border:    rgba(255,255,255,0.10);
  --orange:    #e8622a;
  --yellow:    #f5c518;
  --red:       #d63031;
  --green:     #1f9e56;
  --cyan:      #3bbfda;
  --dim:       #6a8aaa;
  --bright:    #dceaf8;
  --amber:     #f5a623;
  --purple:    #bb66ff;
  --void:      #07111e;
  --text:      #dceaf8;
  --text-dim:  #6a8aaa;
  --text-label:#6a8aaa;
  --panel-alt: #0d1e32;
  --panel-bright:#162840;
  --border-glow:rgba(232,98,42,0.4);
  --green-dim: #0d3a1e;
  --amber-dim: #3a2000;
  --red-dim:   #3a0a0a;
  --gold:      #f5c518;
  --font:      'Space Grotesk', system-ui, sans-serif;
  --mono:      'DM Mono', 'Courier New', monospace;
  --bebas:     'Bebas Neue', impact, sans-serif;
  --radius:    10px;
}
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { background: var(--bg); overflow-x: hidden; overflow-y: auto; min-height: 100dvh; }
body {
  background: var(--bg); color: var(--bright);
  font-family: var(--font); font-size: 13px; line-height: 1.5;
  display: flex; flex-direction: column; min-height: 100dvh;
  max-width: 480px; margin: 0 auto;
}
/* HUD */
#hud {
  background: linear-gradient(160deg, #150b2e 0%, var(--panel) 100%);
  border-bottom: 1px solid var(--border);
  flex-shrink: 0; position: sticky; top: 0; z-index: 100; overflow: hidden;
}
#hud::before {
  content: ''; position: absolute; inset: 0;
  background-image: linear-gradient(rgba(232,98,42,0.05) 1px,transparent 1px),linear-gradient(90deg,rgba(232,98,42,0.05) 1px,transparent 1px);
  background-size: 28px 28px; pointer-events: none;
}
.hud-header-row {
  position: relative; display: flex; justify-content: space-between;
  align-items: center; padding: 12px 16px 10px;
}
.hud-title { font-family: var(--bebas); font-size: 28px; color: white; letter-spacing: 0.06em; line-height: 1; }
.hud-subtitle { color: var(--dim); font-size: 10px; margin-top: 4px; letter-spacing: 0.03em; }
.hud-right { display: flex; align-items: center; gap: 10px; }
.hud-turn-block { text-align: right; }
.hud-turn-counter { line-height: 1; margin-bottom: 3px; }
.hud-turn-num   { font-family: var(--mono); font-size: 30px; font-weight: 700; color: var(--bright); }
.hud-turn-denom { font-family: var(--mono); font-size: 16px; color: var(--dim); }
.hud-turn-label { font-size: 9px; font-weight: 700; letter-spacing: 0.14em; text-transform: uppercase; color: var(--dim); }
.hud-icon-btn {
  background: rgba(255,255,255,0.06); border: 1px solid var(--border);
  border-radius: 8px; padding: 6px 8px; color: var(--dim);
  cursor: pointer; font-size: 14px; touch-action: manipulation; font-family: var(--font);
}
.hud-stats-grid { display: flex; border-top: 1px solid var(--border); }
.hud-stat-col { flex: 1; padding: 7px 0 6px; text-align: center; border-right: 1px solid var(--border); }
.hud-stat-col:last-child { border-right: none; }
.hud-stat-label { font-size: 9px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); margin-bottom: 2px; }
.hud-stat-val { font-family: var(--mono); font-size: 12px; font-weight: 500; }
.ipo-strip { height: 2px; background: rgba(255,255,255,0.06); margin: 0 12px 6px; }
.ipo-strip-fill { height: 100%; background: linear-gradient(90deg, var(--cyan), var(--orange)); transition: width 0.4s ease; }
/* MAIN */
#main { flex: 1; overflow-y: auto; padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 10px; }
.section-header { display: flex; justify-content: space-between; align-items: center; flex-shrink: 0; margin-bottom: 2px; }
.section-label { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--dim); }
.page-dots { display: flex; gap: 5px; align-items: center; }
.dot-active   { width: 22px; height: 5px; background: var(--orange); border-radius: 3px; }
.dot-inactive { width:  7px; height: 5px; background: rgba(255,255,255,0.15); border-radius: 3px; }
/* STEPPER */
#phase-stepper {
  background: var(--panel); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border);
  padding: 10px 16px; display: flex; align-items: center; gap: 10px; flex-shrink: 0;
}
.stepper-circles { display: flex; align-items: center; flex-shrink: 0; }
.stepper-dot {
  width: 24px; height: 24px; border-radius: 50%;
  display: flex; align-items: center; justify-content: center;
  font-size: 9px; font-weight: 700; flex-shrink: 0;
}
.s-active   { background: var(--orange); border: 1.5px solid var(--orange); color: white; }
.s-done     { background: rgba(31,158,86,0.25); border: 1.5px solid var(--green); color: var(--green); }
.s-inactive { background: rgba(255,255,255,0.07); border: 1.5px solid rgba(255,255,255,0.15); color: var(--dim); }
.stepper-line { width: 22px; height: 1px; background: rgba(255,255,255,0.12); }
.stepper-info { margin-left: 4px; flex: 1; }
.stepper-phase { font-size: 10px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--orange); }
.stepper-sub   { font-size: 9px; letter-spacing: 0.04em; text-transform: uppercase; color: var(--dim); margin-top: 1px; }
/* TAB BAR */
#tab-bar { background: var(--panel); display: flex; flex-shrink: 0; padding-bottom: env(safe-area-inset-bottom,0px); }
.tab-item {
  flex: 1; padding: 10px 0 12px; display: flex; flex-direction: column; align-items: center; gap: 3px;
  cursor: pointer; touch-action: manipulation; background: none; border: none; font-family: var(--font);
}
.tab-icon  { font-size: 19px; }
.tab-label { font-size: 9px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--dim); }
.tab-item.t-active .tab-label { color: var(--orange); }
.tab-pip   { width: 20px; height: 2px; background: var(--orange); border-radius: 1px; }
/* BUTTONS */
.btn-sign {
  background: var(--green); color: white; border: none; border-radius: var(--radius);
  padding: 13px; font-size: 15px; font-weight: 700; font-family: var(--font);
  letter-spacing: 0.02em; text-align: center; cursor: pointer; touch-action: manipulation;
  width: 100%; box-shadow: 0 4px 16px rgba(31,158,86,0.35); min-height: 44px; display: block;
}
.btn-pass {
  background: rgba(255,255,255,0.05); color: var(--dim);
  border: 1px solid rgba(255,255,255,0.12); border-radius: var(--radius);
  padding: 10px; font-size: 13px; font-weight: 600; font-family: var(--font);
  text-align: center; cursor: pointer; touch-action: manipulation; width: 100%; min-height: 44px; display: block;
}
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 18px; border-radius: var(--radius);
  font-family: var(--font); font-size: 13px; font-weight: 600;
  cursor: pointer; border: 1px solid transparent; transition: all 0.12s;
  touch-action: manipulation; text-decoration: none; user-select: none; min-height: 44px;
}
.btn:active { opacity: 0.85; }
.btn-primary { background: var(--orange); color: white; border-color: var(--orange); }
.btn-success { background: var(--green); color: white; border-color: var(--green); box-shadow: 0 4px 16px rgba(31,158,86,0.3); }
.btn-danger  { background: rgba(214,48,49,0.15); color: var(--red); border-color: rgba(214,48,49,0.4); }
.btn-ghost   { background: rgba(255,255,255,0.05); color: var(--dim); border-color: var(--border); font-size: 12px; min-height: 38px; }
.btn-ghost:hover { border-color: rgba(255,255,255,0.25); color: var(--bright); }
.btn-sm { padding: 7px 14px; font-size: 12px; min-height: 36px; }
.btn-full { width: 100%; justify-content: center; }
.kbd-hint { display: inline-block; background: rgba(255,255,255,0.08); border: 1px solid var(--border); border-radius: 4px; padding: 1px 5px; font-size: 10px; color: var(--dim); margin-left: 6px; }
/* GAME CARDS */
.game-card { background: var(--card); border-radius: 16px; border: 1px solid var(--border); overflow: hidden; }
.card-stripe { height: 4px; flex-shrink: 0; }
.card-body { padding: 14px 16px; display: flex; flex-direction: column; gap: 11px; }
/* OFFER CARDS */
.offer-category-row { display: flex; justify-content: space-between; align-items: center; }
.offer-category { font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: var(--cyan); }
.offer-risk-badge { font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; padding: 3px 8px; border-radius: 4px; color: white; }
.offer-company { font-family: var(--font); font-size: 21px; font-weight: 700; color: var(--bright); line-height: 1.2; }
.offer-tagline { font-size: 11px; font-style: italic; color: var(--dim); margin-top: 7px; line-height: 1.5; border-left: 3px solid rgba(59,191,218,0.35); padding-left: 9px; }
.offer-details { border-top: 1px solid rgba(255,255,255,0.08); border-bottom: 1px solid rgba(255,255,255,0.08); padding: 10px 0; display: flex; flex-direction: column; gap: 9px; }
.offer-detail-row { display: flex; justify-content: space-between; align-items: center; }
.detail-label { font-size: 11px; font-weight: 500; color: var(--dim); }
.detail-val   { font-family: var(--mono); font-size: 12px; font-weight: 500; color: var(--yellow); }
.slider-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px; }
.slider-label  { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--dim); }
.slider-val    { font-family: var(--mono); font-size: 17px; font-weight: 500; color: var(--cyan); }
.offer-slider { -webkit-appearance:none; appearance:none; width:100%; height:7px; border-radius:4px; outline:none; cursor:pointer; display:block; }
.offer-slider::-webkit-slider-thumb { -webkit-appearance:none; width:22px; height:22px; border-radius:50%; background:var(--orange); border:2.5px solid white; box-shadow:0 0 10px var(--orange); cursor:pointer; }
.offer-slider::-moz-range-thumb { width:22px; height:22px; border-radius:50%; background:var(--orange); border:2.5px solid white; box-shadow:0 0 10px var(--orange); cursor:pointer; }
.slider-minmax { display: flex; justify-content: space-between; margin-top: 3px; }
.slider-minmax span { font-family: var(--mono); font-size: 8px; color: var(--dim); }
.margin-box { background: rgba(0,0,0,0.25); border-radius: 10px; padding: 10px 12px; border: 1px solid rgba(255,255,255,0.07); display: flex; flex-direction: column; gap: 7px; }
.margin-header { display: flex; justify-content: space-between; align-items: center; }
.margin-label  { font-size: 9px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.08em; color: var(--dim); }
.margin-value  { font-family: var(--mono); font-size: 14px; font-weight: 500; transition: color 0.2s; }
.margin-bar-row{ display: flex; align-items: center; gap: 8px; }
.margin-bar    { flex: 1; height: 6px; background: rgba(255,255,255,0.08); border-radius: 3px; overflow: hidden; }
.margin-fill   { height: 100%; border-radius: 3px; transition: width 0.15s ease, background 0.15s ease; }
.margin-pct    { font-family: var(--mono); font-size: 11px; font-weight: 500; min-width: 30px; text-align: right; transition: color 0.2s; }
.margin-ratio  { font-size: 9px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.04em; color: var(--dim); }
.offer-actions { display: flex; flex-direction: column; gap: 8px; }
.offer-list    { display: flex; flex-direction: column; gap: 14px; }
/* EVENT CARDS */
.event-type-badge { display: inline-flex; align-items: center; gap: 5px; padding: 3px 8px; border-radius: 4px; font-size: 9px; font-weight: 800; letter-spacing: 0.1em; text-transform: uppercase; }
.event-line-tag { font-size: 10px; color: var(--dim); letter-spacing: 0.5px; text-transform: uppercase; }
.event-card-header { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.event-title  { font-size: 18px; font-weight: 700; color: var(--bright); line-height: 1.3; }
.event-flavor { font-size: 12px; color: var(--dim); line-height: 1.7; font-style: italic; padding: 10px 12px; background: rgba(0,0,0,0.2); border-left: 2px solid rgba(59,191,218,0.3); border-radius: 4px; }
.event-choices { display: flex; flex-direction: column; gap: 8px; }
.event-choice-btn { display: flex; align-items: flex-start; justify-content: space-between; padding: 12px 14px; min-height: 52px; background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.10); border-radius: var(--radius); font-family: var(--font); font-size: 12px; color: var(--bright); cursor: pointer; text-align: left; touch-action: manipulation; transition: border-color 0.12s, background 0.12s; flex-wrap: wrap; gap: 8px; }
.event-choice-btn:hover { border-color: var(--cyan); background: rgba(59,191,218,0.07); }
.choice-preview { font-size: 10px; color: var(--dim); white-space: normal; flex-shrink: 0; font-family: var(--mono); }
.resolved-summary { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 14px; }
.resolved-summary-title  { font-size: 11px; font-weight: 700; color: var(--dim); margin-bottom: 4px; }
.resolved-summary-result { color: var(--dim); font-style: italic; font-size: 12px; }
.cards-pending-indicator { font-size: 11px; color: var(--amber); margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
/* STAFF CARDS */
.staff-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; transition: border-color 0.15s; margin-bottom: 10px; }
.staff-card.hired { border-color: rgba(31,158,86,0.4); background: rgba(31,158,86,0.06); }
/* POLICY CARDS */
.policy-card { background: var(--card); border: 1px solid var(--border); border-left: 3px solid; border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; font-size: 12px; }
.policy-card-line  { font-size: 10px; margin-bottom: 3px; display: flex; align-items: center; gap: 6px; }
.policy-card-name  { font-size: 14px; font-weight: 700; color: var(--bright); margin-bottom: 4px; }
.policy-card-stats { display: flex; justify-content: space-between; color: var(--dim); font-size: 11px; font-family: var(--mono); }
.terms-pips { display: flex; gap: 4px; margin-top: 6px; }
.term-pip { width: 10px; height: 4px; border-radius: 2px; background: rgba(255,255,255,0.15); }
.term-pip.active { background: var(--cyan); }
/* LEDGER */
.ledger { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.ledger-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 13px; }
.ledger-row:last-child { border-bottom: none; }
.ledger-row.total { font-weight: 700; font-size: 15px; font-family: var(--mono); margin-top: 4px; padding-top: 8px; border-top: 1px solid var(--border); border-bottom: none; }
.ledger-label { color: var(--dim); }
.report-stat-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 14px; }
.report-stat { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 10px; padding: 12px; text-align: center; }
.report-stat-label { font-size: 10px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.report-stat-val   { font-size: 20px; font-weight: 700; font-family: var(--mono); }
.info-box { background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; line-height: 1.8; }
.empty-state { border: 1px dashed rgba(255,255,255,0.12); border-radius: 12px; padding: 24px 12px; text-align: center; color: var(--dim); font-size: 12px; line-height: 1.8; }
.log-entry { padding: 4px 0; font-size: 11px; border-bottom: 1px solid rgba(255,255,255,0.05); color: var(--dim); }
.log-entry:last-child { border-bottom: none; }
.log-income { color: var(--green); } .log-expense { color: var(--red); } .log-warn { color: var(--amber); } .log-info { color: var(--cyan); } .log-system { color: var(--bright); opacity: 0.7; }
.solvency-badge { padding: 4px 10px; border-radius: 4px; font-weight: 700; font-size: 12px; letter-spacing: 1.5px; }
.sol-green  { background: rgba(31,158,86,0.15);  color: var(--green);  border: 1px solid rgba(31,158,86,0.3); }
.sol-amber  { background: rgba(245,198,24,0.12); color: var(--yellow); border: 1px solid rgba(245,198,24,0.3); }
.sol-orange { background: rgba(232,98,42,0.12);  color: var(--orange); border: 1px solid rgba(232,98,42,0.3); }
.sol-red    { background: rgba(214,48,49,0.15);  color: var(--red);    border: 1px solid rgba(214,48,49,0.3); }
/* MODAL */
#modal-overlay { position: fixed; inset: 0; background: rgba(7,17,30,0.92); display: flex; align-items: center; justify-content: center; z-index: 200; backdrop-filter: blur(4px); padding: 16px; }
#modal-overlay.hidden { display: none; }
.modal { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 28px 24px; width: 100%; max-width: 440px; max-height: 92dvh; overflow-y: auto; box-shadow: 0 24px 64px rgba(0,0,0,0.6); text-align: center; }
.fade-in { animation: fadeIn 0.25s ease; }
@keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }
.modal-icon  { font-size: 48px; margin-bottom: 12px; }
.modal-title { font-family: var(--bebas); font-size: 28px; letter-spacing: 0.05em; margin-bottom: 10px; }
.modal-body  { color: var(--dim); line-height: 1.7; margin-bottom: 24px; font-size: 13px; }
.modal-stat-row { display: grid; grid-template-columns: repeat(3,1fr); gap: 10px; margin-bottom: 16px; }
.modal-stat-item { background: rgba(0,0,0,0.25); border: 1px solid var(--border); border-radius: 10px; padding: 12px 8px; }
.modal-stat-label { font-size: 9px; color: var(--dim); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; }
.modal-stat-val   { font-family: var(--mono); font-size: 18px; font-weight: 700; }
.modal-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.unlock-list { display: flex; flex-direction: column; gap: 8px; }
.unlock-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 10px; text-align: left; }
.unlock-item.owned { border-color: rgba(31,158,86,0.3); background: rgba(31,158,86,0.06); }
/* SETTINGS */
#settings-overlay { position: fixed; inset: 0; background: rgba(7,17,30,0.95); display: flex; align-items: center; justify-content: center; z-index: 300; padding: 16px; backdrop-filter: blur(4px); }
#settings-overlay.hidden { display: none; }
.settings-modal { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 24px 20px; width: 100%; max-width: 440px; max-height: 92dvh; overflow-y: auto; }
.settings-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
.settings-row:last-child { border-bottom: none; }
.settings-label { font-size: 13px; font-weight: 600; color: var(--bright); margin-bottom: 2px; }
.settings-desc  { font-size: 11px; color: var(--dim); }
.settings-control { flex-shrink: 0; display: flex; align-items: center; gap: 8px; }
/* DEBUG */
#debug-panel { position: fixed; top: 12px; right: 12px; background: rgba(13,30,50,0.97); border: 1px solid var(--orange); border-radius: 10px; padding: 10px 12px; width: 220px; z-index: 500; font-size: 11px; box-shadow: 0 0 20px rgba(232,98,42,0.2); }
#debug-panel.hidden { display: none; }
.dbg-title { font-size: 10px; color: var(--orange); text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; display: flex; justify-content: space-between; }
.dbg-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,0.06); color: var(--dim); }
.dbg-row strong { color: var(--bright); font-family: var(--mono); }
.dbg-btns { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
.dbg-btn { background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 4px; padding: 3px 7px; font-size: 10px; color: var(--dim); cursor: pointer; font-family: var(--font); }
/* TOASTS */
#toast-container { position: fixed; bottom: 80px; right: 12px; z-index: 9000; display: flex; flex-direction: column-reverse; gap: 8px; pointer-events: none; }
.achievement-toast { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--yellow); border-radius: 10px; padding: 10px 14px; box-shadow: 0 0 20px rgba(245,198,24,0.2); opacity: 0; transform: translateX(30px); transition: opacity 0.3s ease, transform 0.3s ease; min-width: 220px; }
.achievement-toast.toast-visible { opacity: 1; transform: translateX(0); }
.toast-icon  { font-size: 20px; flex-shrink: 0; }
.toast-title { font-size: 9px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--yellow); margin-bottom: 2px; }

/* ============================================================
   DAILY CHALLENGE HELPERS (M11)
   ============================================================ */
function getDailyDateStr() {
  const d = new Date();
  const y = d.getFullYear();
  const mo = String(d.getMonth() + 1).padStart(2, '0');
  const dy = String(d.getDate()).padStart(2, '0');
  return `${y}-${mo}-${dy}`;
}

function getDailySeed() {
  const str = getDailyDateStr();
  let h = 0x811c9dc5;
  for (let i = 0; i < str.length; i++) {
    h ^= str.charCodeAt(i);
    h = (h * 0x01000193) >>> 0;
  }
  return h || 1;
}

function initialMeta() {
  return {
    industrycred:  0,
    unlocks:       [],
    totalRuns:     0,
    bestCapital:   0,
    bestTurns:     0,
    achievements:  [],     // M12: array of unlocked achievement IDs
    runHistory:    [],     // M12: last 10 run summaries
    dailyBest:     {},     // M11: keyed by 'YYYY-MM-DD' → best capital
  };
}

let meta = initialMeta();

function saveMeta() {
  try { localStorage.setItem(META_KEY, JSON.stringify(meta)); } catch(e) {}
}

function loadMeta() {
  try {
    const raw = localStorage.getItem(META_KEY);
    if (raw) meta = { ...initialMeta(), ...JSON.parse(raw) };
  } catch(e) {}
}

/* ============================================================
   ACHIEVEMENT ENGINE (M12)
   ============================================================ */
function checkAchievements() {
  const newlyUnlocked = [];
  for (const a of ACHIEVEMENTS) {
    if (meta.achievements.includes(a.id)) continue;
    try {
      if (a.condition(game, meta)) {
        meta.achievements.push(a.id);
        newlyUnlocked.push(a);
      }
    } catch (_) { /* guard against mid-game partial state */ }
  }
  if (newlyUnlocked.length > 0) {
    saveMeta();
    newlyUnlocked.forEach(a => showAchievementToast(a));
  }
}

function showAchievementToast(achievement) {
  const container = document.getElementById('toast-container');
  if (!container) return;
  const id = 'toast-' + Date.now() + '-' + Math.random().toString(36).slice(2);
  const el = document.createElement('div');
  el.className = 'achievement-toast';
  el.id = id;
  el.innerHTML = `
    <span class="toast-icon">${achievement.icon}</span>
    <div class="toast-body">
      <div class="toast-title">Achievement Unlocked</div>
      <div class="toast-name">${achievement.name}</div>
    </div>`;
  container.appendChild(el);
  // Fade in
  requestAnimationFrame(() => el.classList.add('toast-visible'));
  // Auto-dismiss after 3.5s
  setTimeout(() => {
    el.classList.remove('toast-visible');
    setTimeout(() => el.remove(), 400);
  }, 3500);
}

/* ============================================================
   RUN HISTORY (M12)
   ============================================================ */
function saveRunHistory() {
  const entry = {
    date:       getDailyDateStr(),
    seedHex:    (game.seed >>> 0).toString(16).toUpperCase().padStart(8, '0'),
    turns:      game.turn,
    capital:    game.capital,
    reputation: game.reputation,
    outcome:    game.isVictory
                  ? (game.gameOverReason === 'ipo' ? 'IPO Victory' : 'Narrow Exit')
                  : (game.gameOverReason === 'bankrupt' ? 'Bankrupt' : 'License Revoked'),
    isDaily:    game.isDaily || false,
  };
  meta.runHistory = [entry, ...(meta.runHistory || [])].slice(0, 10);
  saveMeta();
}

function earnIC() {
  const turns   = game.turn;
  const capital = game.capital;
  const base    = turns;
  const winBonus = game.isVictory ? 10 : 0;
  const capBonus = Math.floor(capital / 5000);
  return Math.max(1, base + winBonus + capBonus);
}

function applyStartBonuses() {
  for (const unlockId of meta.unlocks) {
    const u = UNLOCKS.find(u => u.id === unlockId);
    if (!u) continue;
    const b = u.startBonus;
    if (b.capital)       game.capital    += b.capital;
    if (b.reputation)    game.reputation += b.reputation;
    if (b.freeReins)     game.reinsurancePurchased = true;
    if (b.freeActuarial) game.flags.freeActuarial  = true;
  }
}

function hasUnlock(id) {
  return meta.unlocks.includes(id);
}

/* ============================================================
   SEEDED RNG — Mulberry32
   ============================================================ */
function createRNG(seed) {
  let s = (seed >>> 0) || 1337;
  const r = {
    next() {
      s += 0x6D2B79F5;
      let z = Math.imul(s ^ (s >>> 15), s | 1);
      z ^= z + Math.imul(z ^ (z >>> 7), z | 61);
      return ((z ^ (z >>> 14)) >>> 0) / 4294967296;
    },
    nextInt(min, max) { return Math.floor(r.next() * (max - min + 1)) + min; },
    pick(arr)         { return arr[r.nextInt(0, arr.length - 1)]; },
    roll(prob)        { return r.next() < prob; },
    getState()        { return s; },
    setState(v)       { s = v >>> 0; },
  };
  return r;
}

/* ============================================================
   STATE SCHEMA
   ============================================================ */
function initialState() {
  const seed = (Math.random() * 0x7FFFFFFF) | 0;
  return {
    version:    GAME_VERSION,
    seed,
    rngState:   seed,

    // Turn
    turn:       1,
    maxTurns:   MAX_TURNS,
    phase:      'portfolio',

    // Core stats
    capital:    BALANCE.startCapital,
    reputation: BALANCE.startReputation,
    exposure:   0,     // total max payout of active policies
    heat:       0,     // 0–100

    // Derived
    solvencyRating: 'A',

    // Collections
    policies:   [],
    staff:      [],

    // Client offers (refreshed each portfolio phase)
    pendingOffers: [],

    // Events
    activeEvents:   [],
    pendingCards:   [],
    resolvedCards:  [],

    // Economy
    lastIncome:   0,
    lastExpenses: 0,
    lastNet:      0,
    lifetimeIncome:   0,
    lifetimeExpenses: 0,
    resolutionDetail: [],  // per-policy rows for the resolution UI
    lastExpiredIds:   [],  // archetypes that expired last turn (for renewal priority)

    // M5: Reinsurance & catastrophes
    reinsurancePurchased: false,  // true if player bought reinsurance this turn
    reinsuranceCap:       BALANCE.reinsuranceCap,
    activeCrisis:         null,   // {cardId, turnsLeft, data} if a multi-turn crisis is running

    // M11: Daily challenge
    isDaily:              false,  // true when playing the daily seed

    // M12: Per-run achievement trackers
    catSurvivedNoReins:   false,  // true after surviving a cat without reinsurance
    specialtyResolved:    0,      // count of specialty cards resolved this run

    // Log
    log: [],

    // Flags
    flags: {},

    // Terminal
    isGameOver: false,
    isVictory:  false,
    gameOverReason: '',
  };
}

/* ============================================================
   DERIVED CALCULATIONS
   ============================================================ */
function calcSolvency(capital, exposure) {
  if (exposure === 0) return capital > 0 ? 'AAA' : 'D';
  const r = capital / exposure;
  if (r >= 10)  return 'AAA';
  if (r >= 5)   return 'AA';
  if (r >= 3)   return 'A';
  if (r >= 2)   return 'BBB';
  if (r >= 1)   return 'BB';
  if (r >= 0.5) return 'B';
  if (r >= 0.1) return 'CCC';
  return 'D';
}

function calcTotalPremium(policies) {
  return policies.reduce((s, p) => s + (p.premium || 0), 0);
}

function calcTotalExposure(policies) {
  return policies.reduce((s, p) => s + (p.maxPayout || 0), 0);
}

function solvencyClass(rating) {
  if (['AAA','AA'].includes(rating))    return 'sol-green';
  if (['A','BBB'].includes(rating))     return 'sol-amber';
  if (['BB','B'].includes(rating))      return 'sol-orange';
  return 'sol-red';
}

/* ============================================================
   STATE MANAGEMENT
   ============================================================ */
let game = initialState();
let rng  = createRNG(game.seed);

// Tracks slider positions between renders without polluting game state
const _sliderMult = {};  // offerId → multiplier (default 1.0)

// Active tab: 'offers' | 'staff' | 'portfolio' | 'log'
let _activeTab = 'offers';

// Compact number formatter for HUD (e.g. 10000 → ¢10k)
function fmtK(n) {
  const abs = Math.abs(Math.round(n));
  if (abs >= 1000) return '¢' + (Math.round(abs / 100) / 10) + 'k';
  return '¢' + abs;
}

function setState(patch) {
  game = { ...game, ...patch };

  // Clamp
  game.capital    = Math.max(0, game.capital);
  game.reputation = Math.max(0, Math.min(100, game.reputation));
  game.heat       = Math.max(0, Math.min(100, game.heat));

  // Derive
  game.exposure       = calcTotalExposure(game.policies);
  game.solvencyRating = calcSolvency(game.capital, game.exposure);
  game.rngState       = rng.getState();

  saveGame();
  checkAchievements();
  render();
}

/* ============================================================
   LOGGING
   ============================================================ */
function pushLog(type, text) {
  const entry = { type, text, turn: game.turn };
  game.log = [entry, ...game.log].slice(0, 60);
}

function addLog(type, text) {
  pushLog(type, text);
  setState({});  // trigger save + render
}

/* ============================================================
   STORAGE
   ============================================================ */
function saveGame() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(game)); }
  catch (e) { /* storage full or private mode */ }
}

function loadGame() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const saved = JSON.parse(raw);
    if (saved.version !== GAME_VERSION) return false;
    game = saved;
    rng  = createRNG(game.seed);
    rng.setState(game.rngState);
    return true;
  } catch (e) { return false; }
}

function newGame() {
  _icEarned = false;
  _activeTab = 'offers';
  game = initialState();
  rng  = createRNG(game.seed);
  applyStartBonuses();  // apply meta-unlock bonuses
  game.pendingOffers = pickOffers();
  pushLog('system', '🏢 Mutual of Andromeda is open for business.');
  pushLog('info',   `🌌 Fiscal year ${START_YEAR} begins. What could possibly go wrong?`);
  setState({});
}

/* ============================================================
   TURN / PHASE LOGIC
   ============================================================ */
function turnToDate(turn) {
  const year    = START_YEAR + Math.floor((turn - 1) / 4);
  const quarter = ((turn - 1) % 4) + 1;
  return `Q${quarter} ${year}`;
}

function drawCards() {
  const activeLines = new Set(game.policies.map(p => p.line));
  const eligible = CARD_DECK.filter(c => {
    if (c.minTurn && game.turn < c.minTurn) return false;
    if (c.maxTurn && game.turn > c.maxTurn) return false;
    const cond = c.conditions || {};
    if (cond.requiresLine && !activeLines.has(cond.requiresLine)) return false;
    if (cond.minHeat !== undefined && game.heat < cond.minHeat) return false;
    // Claim cards only fire against lines the player actually holds
    if (c.type === 'claim' && c.line !== 'any' && !activeLines.has(c.line)) return false;
    return true;
  });

  // Weighted random draw, no duplicate ids
  const count  = rng.nextInt(1, 3);
  const drawn  = [];
  const taken  = new Set();
  const weights = eligible.map(c => c.weight || 5);
  const total = weights.reduce((s, w) => s + w, 0);

  for (let attempt = 0; attempt < count * 5 && drawn.length < count; attempt++) {
    let r = rng.next() * total;
    for (let i = 0; i < eligible.length; i++) {
      r -= weights[i];
      if (r <= 0 && !taken.has(eligible[i].id)) {
        taken.add(eligible[i].id);
        drawn.push(eligible[i]);
        break;
      }
    }
  }
  return drawn;
}

function resolveChoice(cardId, choiceIdx) {
  const card = (game.pendingCards || []).find(c => c.id === cardId);
  if (!card) return;
  const choice = card.choices[choiceIdx];
  const fx = choice.effects || {};

  const patch = {
    capital:           game.capital    + (fx.cash      || 0),
    reputation:        game.reputation + (fx.rep       || 0),
    heat:              game.heat       + (fx.heat      || 0),
    pendingCards:      (game.pendingCards || []).filter(c => c.id !== cardId),
    resolvedCards:     [...game.resolvedCards, { cardId, title:card.title, choice:choice.label, result:choice.result }],
    specialtyResolved: (game.specialtyResolved || 0) + (card.line === 'specialty' ? 1 : 0),
  };
  if (fx.flag) patch.flags = { ...game.flags, [fx.flag]: true };

  pushLog(
    card.type === 'opportunity' ? 'income' : card.type === 'flavor' ? 'info' : 'expense',
    `${card.title}: ${choice.label}`
  );
  setState(patch);
}

function pickOffers() {
  const activeIds  = new Set(game.policies.map(p => p.archetypeId));
  const renewalIds = new Set(game.lastExpiredIds || []);
  const pool       = CLIENT_ARCHETYPES.filter(a => !activeIds.has(a.id));

  const renewals = pool.filter(a =>  renewalIds.has(a.id));
  const fresh    = pool.filter(a => !renewalIds.has(a.id));

  for (let i = fresh.length - 1; i > 0; i--) {
    const j = rng.nextInt(0, i);
    [fresh[i], fresh[j]] = [fresh[j], fresh[i]];
  }

  // M9: Low reputation reduces available offers
  const repPenalty = game.reputation < BALANCE.repLowThreshold ? -1 : 0;
  const maxOffers  = Math.max(1, (hasStaff('underwriting') || hasUnlock('connected') ? 4 : 3) + repPenalty);
  return [...renewals, ...fresh]
    .slice(0, Math.min(maxOffers, pool.length))
    .map(a => ({ ...a, isRenewal: renewalIds.has(a.id) }));
}

function advancePhase() {
  if (game.isGameOver) return;
  const idx = PHASES.indexOf(game.phase);

  // Block advancing from events while cards are unresolved
  if (game.phase === 'events' && (game.pendingCards || []).length > 0) return;

  if (idx < PHASES.length - 1) {
    const next = PHASES[idx + 1];
    if (next === 'events') {
      const drawn = drawCards();
      setState({ phase: 'events', pendingCards: drawn, resolvedCards: [] });
    } else if (next === 'resolution') {
      setState({ phase: 'resolution' });
      runResolution();
    } else {
      setState({ phase: next });
    }
  } else {
    endTurn();
  }
}

function difficultyScale(turn) {
  const t = Math.max(1, Math.min(turn, BALANCE.diffByTurn.length - 1));
  return BALANCE.diffByTurn[t] || 1.0;
}

function hasStaff(id) {
  return (game.staff || []).includes(id);
}

function staffUpkeep() {
  return (game.staff || []).reduce((total, id) => {
    const dept = STAFF_DEPTS.find(d => d.id === id);
    return total + (dept ? dept.upkeep : 0);
  }, 0);
}

function runResolution() {
  let income = 0, expenses = 0;
  const survivingPolicies = [];
  const expiredIds        = [];
  const detail            = [];
  const claimsReduction   = hasStaff('claims') ? 0.75 : 1.0;
  const diff              = difficultyScale(game.turn);  // M9: turn-based escalation

  for (const p of game.policies) {
    income += p.premium;
    let claimAmt = 0;
    let hadClaim = false;

    // Apply difficulty scaling to claim probability
    const scaledChance = Math.min(0.90, p.claimChance * diff);
    if (rng.roll(scaledChance)) {
      claimAmt = Math.round(rng.nextInt(p.claimRange[0], p.claimRange[1]) * claimsReduction);
      expenses += claimAmt;
      hadClaim = true;
    }

    const remaining = p.termsRemaining - 1;
    if (remaining > 0) {
      survivingPolicies.push({ ...p, termsRemaining: remaining });
    } else {
      expiredIds.push(p.archetypeId);
    }

    detail.push({
      name:    p.name,
      premium: p.premium,
      hadClaim,
      claimAmt,
      expired: remaining <= 0,
    });
  }

  // Staff upkeep deducted as an expense
  const upkeep = staffUpkeep();
  expenses += upkeep;

  // PR department: +5 rep per quarter
  let repChange = hasStaff('pr') ? 5 : 0;

  // M9: Low reputation auto-accumulates heat
  const repAutoHeat = game.reputation < BALANCE.repCritThreshold ? 5 : 0;
  if (repAutoHeat > 0) pushLog('warn', `⚠ Critical reputation — regulatory heat building (+${repAutoHeat})`);

  // M9: High heat — random policy cancellation
  let cancelledPolicy = null;
  if (game.heat >= BALANCE.heatPolicyCancelThreshold && survivingPolicies.length > 0) {
    const cancelIdx = rng.nextInt(0, survivingPolicies.length - 1);
    cancelledPolicy = survivingPolicies.splice(cancelIdx, 1)[0];
    pushLog('warn', `🔴 Heat ${game.heat} — "${cancelledPolicy.name}" cancelled by client (regulatory pressure)`);
  }

  // M5+M9: Catastrophe roll — scales with exposure AND difficulty
  const diffMult = difficultyScale(game.turn);
  let catCost    = 0;
  let catMessage = '';
  if (game.exposure > 0) {
    const catChance = Math.min(BALANCE.catMaxChance,
      (game.exposure / BALANCE.catExposureScale) * diffMult * 0.15);
    if (rng.roll(catChance)) {
      const rawCat = Math.round(game.exposure * rng.next() * BALANCE.catPayoutFrac * diffMult);
      if (game.reinsurancePurchased) {
        catCost   = Math.min(rawCat, game.reinsuranceCap);
        catMessage = `☄ Catastrophe! Reinsurance capped at ¢${fmt(catCost)} (raw ¢${fmt(rawCat)})`;
      } else {
        catCost   = rawCat;
        catMessage = `☄ Catastrophe! Uninsured loss: ¢${fmt(catCost)}`;
        game.catSurvivedNoReins = true;  // M12: achievement tracker
      }
      expenses += catCost;
    }
  }
  if (catMessage) pushLog('expense', catMessage);

  const net = income - expenses;

  if (income > 0) pushLog('income', `💰 Premiums: +¢${fmt(income)}`);
  if (expenses > 0) pushLog('expense', `💸 Claims + upkeep: -¢${fmt(expenses)}`);
  pushLog(net >= 0 ? 'income' : 'expense',
    `${net >= 0 ? '📈' : '📉'} Net: ${net >= 0 ? '+' : '-'}¢${fmt(Math.abs(net))}`);

  setState({
    capital:              game.capital + net,
    reputation:           Math.max(0, game.reputation + repChange),
    heat:                 Math.min(100, game.heat + repAutoHeat),
    policies:             survivingPolicies,
    lastIncome:           income,
    lastExpenses:         expenses,
    lastNet:              net,
    lifetimeIncome:       game.lifetimeIncome + income,
    lifetimeExpenses:     game.lifetimeExpenses + expenses,
    resolutionDetail:     [
      ...detail,
      ...(catCost > 0 ? [{ name:'Catastrophe Loss', premium:0, hadClaim:true, claimAmt:catCost, expired:false, isCatastrophe:true }] : []),
      ...(cancelledPolicy ? [{ name:`${cancelledPolicy.name} [CANCELLED]`, premium:0, hadClaim:false, claimAmt:0, expired:true, isCancelled:true }] : []),
    ],
    lastExpiredIds:       expiredIds,
    reinsurancePurchased: false,   // resets each turn
  });
}

function endTurn() {
  const next = game.turn + 1;

  // Lose conditions
  if (game.capital <= 0) {
    game = { ...game, isGameOver:true, isVictory:false, gameOverReason:'bankrupt' };
    saveRunHistory();
    setState({});
    return;
  }
  if (game.reputation <= 0) {
    game = { ...game, isGameOver:true, isVictory:false, gameOverReason:'license' };
    saveRunHistory();
    setState({});
    return;
  }

  // Win condition — survive all turns AND meet capital threshold
  if (next > game.maxTurns) {
    const fullIPO = game.capital >= BALANCE.winCapital;
    game = { ...game, isGameOver:true, isVictory:true, gameOverReason: fullIPO ? 'ipo' : 'ipo-narrow' };
    saveRunHistory();
    setState({});
    return;
  }

  // Pick fresh offers for the new portfolio phase
  const newTurnState = { turn: next, phase: 'portfolio', resolvedCards: [] };
  game = { ...game, ...newTurnState };  // temporarily advance turn so pickOffers sees right active policies
  newTurnState.pendingOffers = pickOffers();

  pushLog('system', `📅 ${turnToDate(next)} — New quarter begins.`);
  setState(newTurnState);
}

/* ============================================================
   FORMATTING HELPERS
   ============================================================ */
function fmt(n) { return Math.round(Math.abs(n)).toLocaleString(); }
function pct(n) { return `${Math.round(n)}%`; }

function moneyColor(n) {
  if (n > 5000)  return 'var(--green)';
  if (n > 2000)  return 'var(--amber)';
  return 'var(--red)';
}
function repColor(r) {
  if (r >= 60) return 'var(--cyan)';
  if (r >= 30) return 'var(--amber)';
  return 'var(--red)';
}
function heatColor(h) {
  if (h < 30) return 'var(--green)';
  if (h < 65) return 'var(--amber)';
  return 'var(--red)';
}
function netColor(n) { return n >= 0 ? 'var(--green)' : 'var(--red)'; }

function updateSliderTrack(slider) {
  const pct = ((parseInt(slider.value,10) - 70) / 60) * 100;
  slider.style.background = `linear-gradient(to right, var(--cyan) 0%, var(--orange) ${pct}%, rgba(255,255,255,0.1) ${pct}%)`;
}

/* Offers tab — renders the active phase content */

            const lr       = Math.round(expLoss / adjPrem * 100);

                <span class="margin-pct" style="color:${mc}">${lr}%</span>
                <span class="margin-ratio">loss ratio</span>
              </div>
            </div>`;
          } else {
            const lo = Math.round(adjPrem - o.claimChance * o.claimRange[1]);
            const hi = Math.round(adjPrem - o.claimChance * o.claimRange[0]);
            const mc = (lo>0&&hi>0)?'var(--green)':(lo<0&&hi<0)?'var(--red)':'var(--orange)';
            const ml = (lo>0&&hi>0)?'likely profitable':(lo<0&&hi<0)?'likely a loss':'uncertain';
            const fb = n => `${n>=0?'+':'-'}¢${Math.abs(n).toLocaleString()}`;
            marginHtml = `<div class="margin-box" id="margin-${o.id}">
              <div class="margin-header">
                <span class="margin-label">Rough Margin</span>
                <span class="margin-value" style="color:${mc}">${fb(lo)} to ${fb(hi)}/qtr</span>
              </div>
              <div class="margin-bar-row">
                <div style="flex:1;font-size:10px;color:${mc};font-style:italic">${ml}</div>

          }
          return `

  }

  /* ── RESOLUTION PHASE ── */
  if (phase === 'resolution') {

    const detail = resolutionDetail || [];
    const upkeep = staffUpkeep();
    const rows = detail.map(d => {

    const mkBar=(n,ch,bg)=>'['+ch.repeat(n)+bg.repeat(barW-n)+']';

function renderPhaseStepper() {

  const current = STEPPER_PHASES[phaseIdx] || STEPPER_PHASES[0];

  const diffClr = diff<=0.85?'var(--green)':diff<=1.0?'var(--cyan)':diff<=1.3?'var(--orange)':'var(--red)';

  document.getElementById('phase-stepper').innerHTML = `
    <div class="stepper-circles">${circles}</div>

/* ============================================================
   EVENT DELEGATION
   ============================================================ */
document.addEventListener('click', e => {
  const el = e.target.closest('[data-action]');
  if (!el) return;
  handleAction(el.dataset.action, el.dataset.value, el.dataset);
});

// Slider: update premium display, track gradient, and margin box without full setState
document.addEventListener('input', e => {
  const slider = e.target;
  if (!slider.dataset.sliderOffer) return;
  const offerId = slider.dataset.sliderOffer;
  const mult    = parseInt(slider.value, 10) / 100;
  _sliderMult[offerId] = mult;

  const offer = (game.pendingOffers || []).find(o => o.id === offerId);
  if (!offer) return;
  const adj = Math.round(offer.basePremium * mult);

  // Track gradient
  updateSliderTrack(slider);

  // Premium label
  const label = document.getElementById(`prem-${offerId}`);
  if (label) label.textContent = `¢${adj.toLocaleString()}/qtr`;

  // Margin box live update
  const marginEl = document.getElementById(`margin-${offerId}`);
  if (!marginEl) return;
  const hasAct = hasStaff('actuarial') || hasUnlock('actuarial-intern') || !!(game.flags && game.flags.freeActuarial);
  const avgClaim = (offer.claimRange[0] + offer.claimRange[1]) / 2;
  const expLoss  = Math.round(offer.claimChance * avgClaim);

  if (hasAct) {
    const margin = adj - expLoss;
    const lr     = Math.round(expLoss / adj * 100);
    const mc     = lr < 65 ? 'var(--green)' : lr < 85 ? 'var(--orange)' : 'var(--red)';
    marginEl.querySelector('.margin-value').textContent = `${margin>=0?'+':'-'}¢${Math.abs(margin).toLocaleString()}/qtr`;
    marginEl.querySelector('.margin-value').style.color = mc;
    const fill = marginEl.querySelector('.margin-fill');
    if (fill) { fill.style.width = Math.min(lr,100)+'%'; fill.style.background = mc; }
    const pct = marginEl.querySelector('.margin-pct');
    if (pct) { pct.textContent = lr+'%'; pct.style.color = mc; }
  } else {
    const lo = Math.round(adj - offer.claimChance * offer.claimRange[1]);
    const hi = Math.round(adj - offer.claimChance * offer.claimRange[0]);
    const mc = (lo>0&&hi>0)?'var(--green)':(lo<0&&hi<0)?'var(--red)':'var(--orange)';
    const fb = n => `${n>=0?'+':'-'}¢${Math.abs(n).toLocaleString()}`;
    marginEl.querySelector('.margin-value').textContent = `${fb(lo)} to ${fb(hi)}/qtr`;
    marginEl.querySelector('.margin-value').style.color = mc;
  }
});

function handleAction(action, value, dataset) {
  dataset = dataset || {};
  switch (action) {
    case 'switch-tab':
      _activeTab = value;
      renderMain();
      renderTabBar();
      break;

    case 'advance-phase':
      _activeTab = 'offers';
      advancePhase();
      break;

    case 'new-game':
      if (game.isGameOver || confirm('Start a new run? Current run will be lost.')) {
        newGame();
      }
      break;

    case 'sign-client': {
      const offerId = value;
      const offer   = (game.pendingOffers || []).find(o => o.id === offerId);
      if (!offer) break;
      const mult    = _sliderMult[offerId] || 1.0;
      const premium = Math.round(offer.basePremium * mult);
      const policy  = {
        id:           offerId + '_t' + game.turn,
        archetypeId:  offerId,
        line:         offer.line,
        name:         offer.name,
        premium,
        basePremium:  offer.basePremium,
        maxPayout:    offer.maxPayout,
        claimChance:  offer.claimChance,
        claimRange:   offer.claimRange,
        termsRemaining: offer.terms,
        termsTotal:   offer.terms,
        signedTurn:   game.turn,
      };
      // Slight rep penalty for price-gouging, bonus for fair pricing
      const repDelta = mult > 1.2 ? -4 : mult < 0.85 ? +3 : 0;
      delete _sliderMult[offerId];
      setState({
        policies:      [...game.policies, policy],
        pendingOffers: (game.pendingOffers || []).filter(o => o.id !== offerId),
        reputation:    game.reputation + repDelta,
      });
      addLog('info', `📝 Signed: ${offer.name} @ ¢${fmt(premium)}/qtr`);
      break;
    }

    case 'decline-offer': {
      delete _sliderMult[value];
      setState({ pendingOffers: (game.pendingOffers || []).filter(o => o.id !== value) });
      break;
    }

    case 'resolve-choice': {
      resolveChoice(dataset.cardId, parseInt(dataset.choiceIdx, 10));
      break;
    }

    case 'hire-dept': {
      const dept = STAFF_DEPTS.find(d => d.id === value);
      if (!dept || game.capital < dept.cost) break;
      if ((game.staff || []).includes(value)) break;
      setState({
        capital: game.capital - dept.cost,
        staff:   [...(game.staff || []), value],
      });
      addLog('info', `🏢 Hired: ${dept.name} (¢${fmt(dept.cost)} upfront, ¢${fmt(dept.upkeep)}/qtr)`);
      break;
    }

    case 'fire-dept': {
      const dept2 = STAFF_DEPTS.find(d => d.id === value);
      if (!dept2) break;
      const refund = Math.round(dept2.cost * 0.5);
      setState({
        capital: game.capital + refund,
        staff:   (game.staff || []).filter(id => id !== value),
      });
      addLog('warn', `🔥 Dissolved: ${dept2.name} (refund: ¢${fmt(refund)})`);
      break;
    }

    // M10: Settings & tutorial actions
    case 'open-settings':
      _settingsVisible = true; _tutVisible = false; renderSettings(); break;
    case 'close-settings':
      _settingsVisible = false; renderSettings(); break;
    case 'show-tutorial':
      _settingsVisible = false; showTutorial(); break;
    case 'tut-next':
      if (_tutStep < TUTORIAL_STEPS.length - 1) { _tutStep++; renderSettings(); }
      else { _tutVisible = false; settings.firstRun = false; saveSettings(); renderSettings(); }
      break;
    case 'tut-prev':
      if (_tutStep > 0) { _tutStep--; renderSettings(); } break;
    case 'tut-skip':
      _tutVisible = false; settings.firstRun = false; saveSettings(); renderSettings(); break;
    case 'reset-meta':
      if (confirm('Reset all Industry Cred and unlocks? This cannot be undone.')) {
        meta = initialMeta(); saveMeta(); _settingsVisible = false; renderSettings(); renderHUD();
      }
      break;

    case 'show-credits': {
      const overlay = document.getElementById('settings-overlay');
      overlay.classList.remove('hidden');
      overlay.innerHTML = `
        <div class="settings-modal" style="max-width:480px">
          <div style="text-align:center;margin-bottom:20px">
            ${SVG_ICONS['banner-victory']}
          </div>
          <h2 style="font-size:18px;color:var(--cyan);margin-bottom:6px;text-align:center">Space Insurer</h2>
          <p style="font-size:11px;color:var(--text-dim);text-align:center;margin-bottom:20px">
            v${GAME_VERSION} · A single-file browser roguelike
          </p>
          <div style="font-size:12px;color:var(--text-dim);line-height:2;border-top:1px solid var(--border);padding-top:16px">
            <p><strong style="color:var(--text)">Design & Code</strong> — Claude (Anthropic)</p>
            <p><strong style="color:var(--text)">SVG Assets</strong> — Gemini (Google)</p>
            <p><strong style="color:var(--text)">Executive Producer</strong> — You</p>
            <p style="margin-top:12px;font-size:10px;color:var(--text-dim)">
              All galactic disasters, hive-mind disputes, and existential crises depicted are fictional.
              Mutual of Andromeda is not a real insurance company. Please do not submit claims.
              Gerald is real. Gerald is fine. Probably.
            </p>
          </div>
          <div style="text-align:center;margin-top:16px">
            <button class="btn btn-ghost btn-sm" data-action="close-settings">← Back to Settings</button>
          </div>
        </div>`;
      break;
    }

    case 'seed-new-game': {
      const inp = document.getElementById('seed-input');
      const seedStr = inp ? inp.value.trim() : '';
      const customSeed = seedStr ? parseInt(seedStr, 16) : null;
      if (!customSeed || isNaN(customSeed)) { break; }
      _settingsVisible = false; renderSettings();
      game = initialState();
      game.seed = customSeed >>> 0;
      rng = createRNG(game.seed);
      applyStartBonuses();
      game.pendingOffers = pickOffers();
      pushLog('system', `🎲 Custom seed run: ${customSeed.toString(16).toUpperCase()}`);
      setState({});
      break;
    }

    case 'dbg-capital': setState({ capital:  game.capital    + 5000 }); renderDebugPanel(); break;
    case 'dbg-rep':     setState({ reputation: Math.min(100, game.reputation + 20) }); renderDebugPanel(); break;
    case 'dbg-heat':    setState({ heat: Math.max(0, game.heat - 20) }); renderDebugPanel(); break;
    case 'dbg-turn':    advancePhase(); renderDebugPanel(); break;
    case 'dbg-win':     setState({ isGameOver:true, isVictory:true,  gameOverReason:'ipo' }); break;
    case 'dbg-bust':    setState({ isGameOver:true, isVictory:false, gameOverReason:'bankrupt' }); break;

    case 'buy-unlock': {
      const unlockDef = UNLOCKS.find(u => u.id === value);
      if (!unlockDef || meta.unlocks.includes(value) || meta.industrycred < unlockDef.cost) break;
      meta.industrycred -= unlockDef.cost;
      meta.unlocks.push(value);
      saveMeta();
      renderModal();  // re-render modal with updated state
      break;
    }

    case 'buy-reinsurance': {
      const cost = parseInt(value, 10);
      if (isNaN(cost) || game.capital < cost || game.reinsurancePurchased) break;
      setState({ capital: game.capital - cost, reinsurancePurchased: true });
      addLog('info', `☂ Reinsurance purchased for ¢${fmt(cost)} — catastrophe losses capped at ¢${fmt(game.reinsuranceCap)}`);
      break;
    }

    // M11: Daily Challenge
    case 'play-daily': {
      if (!game.isGameOver && !confirm('Start the Daily Challenge? Current run will be lost.')) break;
      _settingsVisible = false; renderSettings();
      _icEarned = false;
      _activeTab = 'offers';
      game = initialState();
      game.seed   = getDailySeed();
      game.isDaily = true;
      rng = createRNG(game.seed);
      applyStartBonuses();
      game.pendingOffers = pickOffers();
      pushLog('system', `📅 Daily Challenge — ${getDailyDateStr()} — seed: ${game.seed.toString(16).toUpperCase()}`);
      setState({});
      break;
    }

    case 'copy-daily-score': {
      const text = decodeURIComponent(value || '');
      if (!text) break;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).catch(() => {});
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        ta.remove();
      }
      const btn = document.querySelector('[data-action="copy-daily-score"]');
      if (btn) { btn.textContent = '✓ Copied!'; setTimeout(() => { btn.textContent = '📋 Copy Score'; }, 2000); }
      break;
    }

    // M12: Hall of Companies
    case 'show-hall': {
      const overlay = document.getElementById('settings-overlay');
      overlay.classList.remove('hidden');
      const history = meta.runHistory || [];
      const rows = history.length === 0
        ? `<div style="text-align:center;color:var(--text-dim);padding:20px 0">No runs recorded yet. Play a run to get started.</div>`
        : history.map((r, i) => {
            const outcomeColor = r.outcome.includes('Victory') ? 'var(--green)' : r.outcome === 'Narrow Exit' ? 'var(--amber)' : 'var(--red)';
            return `<div style="display:grid;grid-template-columns:24px 1fr auto auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--border)${i === history.length-1 ? ';border-bottom:none':''};font-size:11px">
              <span style="font-size:9px;color:var(--text-dim)">#${i+1}</span>
              <div>
                <div style="color:var(--text);font-size:11px">${r.outcome}${r.isDaily ? ' <span style="color:var(--cyan);font-size:9px">DAILY</span>' : ''}</div>
                <div style="color:var(--text-dim);font-size:9px">${r.date} · ${r.turns} qtrs · Seed: ${r.seedHex}</div>
              </div>
              <div style="text-align:right">
                <div style="color:${outcomeColor};font-size:11px">¢${fmt(r.capital)}</div>
                <div style="color:var(--text-dim);font-size:9px">Rep ${r.reputation}</div>
              </div>
            </div>`;
          }).join('');
      overlay.innerHTML = `
        <div class="settings-modal" style="max-width:520px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
            <h2 style="font-size:16px;color:var(--amber)">📜 Hall of Folded Companies</h2>
            <button class="btn btn-ghost btn-sm" data-action="close-settings">✕ Close</button>
          </div>
          <p style="font-size:10px;color:var(--text-dim);margin-bottom:14px">A dignified memorial to every run. Most didn't make it. Gerald was there for all of them.</p>
          ${rows}
        </div>`;
      break;
    }

    // M12: Achievements panel
    case 'show-achievements': {
      const overlay = document.getElementById('settings-overlay');
      overlay.classList.remove('hidden');
      const unlockedCount = meta.achievements.length;
      const achGrid = ACHIEVEMENTS.map(a => {
        const unlocked = meta.achievements.includes(a.id);
        return `<div style="display:flex;align-items:flex-start;gap:10px;padding:8px;border-radius:4px;background:${unlocked ? 'rgba(0,232,122,0.06)' : 'var(--panel-alt)'};border:1px solid ${unlocked ? 'rgba(0,232,122,0.2)' : 'var(--border)'};margin-bottom:6px">
          <span style="font-size:20px;filter:${unlocked ? 'none' : 'grayscale(1)'}">${a.icon}</span>
          <div style="flex:1">
            <div style="font-size:12px;font-weight:bold;color:${unlocked ? 'var(--green)' : 'var(--text-dim)'}">${unlocked ? a.name : '???'}</div>
            <div style="font-size:10px;color:var(--text-dim)">${unlocked ? a.desc : 'Not yet unlocked'}</div>
          </div>
          ${unlocked ? `<span style="font-size:10px;color:var(--green)">✓</span>` : ''}
        </div>`;
      }).join('');
      overlay.innerHTML = `
        <div class="settings-modal" style="max-width:480px;max-height:90vh;overflow-y:auto">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
            <h2 style="font-size:16px;color:var(--gold)">🏆 Achievements</h2>
            <button class="btn btn-ghost btn-sm" data-action="close-settings">✕ Close</button>
          </div>
          <p style="font-size:10px;color:var(--text-dim);margin-bottom:14px">${unlockedCount} of ${ACHIEVEMENTS.length} unlocked</p>
          ${achGrid}
        </div>`;
      break;
    }
  }
}

/* ============================================================
   INIT
   ============================================================ */
// ============================================================
// SETTINGS (M10)
// ============================================================
const SETTINGS_KEY = 'space_insurer_settings_v1';

const DEFAULT_SETTINGS = {
  soundEnabled:  false,   // WebAudio (future feature hook)
  showSeedBar:   true,    // show run seed in HUD
  difficulty:    'standard',  // 'easy' | 'standard' | 'hard'
  firstRun:      true,    // show tutorial on first launch
};

let settings = { ...DEFAULT_SETTINGS };

function saveSettings() {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); } catch(e) {}
}

function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    if (raw) settings = { ...DEFAULT_SETTINGS, ...JSON.parse(raw) };
  } catch(e) {}
}

// Tutorial steps
const TUTORIAL_STEPS = [
  {
    title: 'Welcome to Mutual of Andromeda 🛡️',
    body: 'You are the CEO of an interstellar insurance company. Your goal: survive 20 quarters without going bankrupt — and accumulate ¢15,000 for a full IPO exit.',
  },
  {
    title: 'The Portfolio Phase 📋',
    body: 'Each quarter begins here. Sign new client policies, adjust their premiums with the slider, and hire staff departments. Signed clients pay premiums — but they also file claims.',
  },
  {
    title: 'Events & Claims ⚡',
    body: 'After signing clients, you\'ll face galactic events: claims, crises, and opportunities. Each has 2–4 choices with different costs and consequences. Press 1/2/3 or click.',
  },
  {
    title: 'Resolution & the Ledger ⚖️',
    body: 'Premiums roll in, claims roll out. Watch the loss ratio — if claims eat more than ~65% of your premium income, you\'re in trouble. High-risk policies have terrible expected value.',
  },
  {
    title: 'Stats to Watch 📊',
    body: 'Capital (don\'t hit ¢0), Reputation (don\'t hit 0 or you lose your license), and Heat (too high and regulators cancel your policies). Use staff to manage all three.',
  },
  {
    title: 'Meta-Progression 🏆',
    body: 'You earn Industry Cred (IC) every run. Spend it on permanent unlocks between runs — better starting capital, extra client offers, and more. Check the end screen.',
  },
];

let _tutStep = 0;
let _tutVisible = false;
let _settingsVisible = false;
let _icEarned = false;  // M11/M12: prevents double IC on modal re-renders

function showTutorial() {
  _tutStep = 0;
  _tutVisible = true;
  renderSettings();
}

function renderSettings() {
  const overlay = document.getElementById('settings-overlay');

  if (_tutVisible) {
    overlay.classList.remove('hidden');
    const step = TUTORIAL_STEPS[_tutStep];
    const isLast = _tutStep >= TUTORIAL_STEPS.length - 1;
    overlay.innerHTML = `
      <div class="settings-modal">
        <div style="font-size:11px;color:var(--text-dim);margin-bottom:12px;letter-spacing:1px;text-transform:uppercase">
          Tutorial — Step ${_tutStep + 1} of ${TUTORIAL_STEPS.length}
        </div>
        <div class="tutorial-title">${step.title}</div>
        <p class="tutorial-body">${step.body}</p>
        <div class="tutorial-nav">
          <span class="tutorial-progress">${'◆'.repeat(_tutStep + 1)}${'◇'.repeat(TUTORIAL_STEPS.length - _tutStep - 1)}</span>
          <div style="display:flex;gap:8px">
            ${_tutStep > 0 ? `<button class="btn btn-ghost btn-sm" data-action="tut-prev">← Back</button>` : ''}
            <button class="btn ${isLast ? 'btn-success' : 'btn-primary'} btn-sm" data-action="tut-next">
              ${isLast ? "Let's Go! 🚀" : 'Next →'}
            </button>
          </div>
        </div>
        <div style="margin-top:12px;text-align:center">
          <button class="btn btn-ghost btn-sm" data-action="tut-skip" style="font-size:10px">Skip tutorial</button>
        </div>
      </div>`;
    return;
  }

  if (_settingsVisible) {
    overlay.classList.remove('hidden');
    const seedHex = game.seed.toString(16).toUpperCase().padStart(8, '0');
    overlay.innerHTML = `
      <div class="settings-modal">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px">
          <h2 style="font-size:16px;color:var(--cyan)">⚙ Settings</h2>
          <button class="btn btn-ghost btn-sm" data-action="close-settings">✕ Close</button>
        </div>

        <div class="settings-row">
          <div>
            <div class="settings-label">Seed</div>
            <div class="settings-desc">Share this code to replay the same run</div>
          </div>
          <div class="settings-control">
            <code style="font-size:11px;color:var(--amber);background:var(--panel-alt);padding:3px 8px;border-radius:3px;border:1px solid var(--border)">${seedHex}</code>
          </div>
        </div>

        <div class="settings-row">
          <div>
            <div class="settings-label">Version</div>
            <div class="settings-desc">Game version stamp</div>
          </div>
          <div class="settings-control">
            <span style="font-size:11px;color:var(--text-dim)">${GAME_VERSION}</span>
          </div>
        </div>

        <div class="settings-row">
          <div>
            <div class="settings-label">Industry Cred</div>
            <div class="settings-desc">Persistent across runs</div>
          </div>
          <div class="settings-control">
            <span style="font-size:14px;color:var(--gold)">${meta.industrycred} IC</span>
          </div>
        </div>

        <div class="settings-row">
          <div>
            <div class="settings-label">Custom Seed</div>
            <div class="settings-desc">Start a new run with a specific seed (hex, 1–8 chars)</div>
          </div>
          <div class="settings-control">
            <input id="seed-input" type="text" placeholder="e.g. DEADBEEF"
              style="width:90px;padding:3px 6px;background:var(--panel-alt);border:1px solid var(--border);
              border-radius:3px;color:var(--amber);font-family:var(--font);font-size:11px;text-transform:uppercase"
              maxlength="8">
            <button class="btn btn-ghost btn-sm" data-action="seed-new-game">Start</button>
          </div>
        </div>

        <div class="settings-row">
          <div>
            <div class="settings-label">Daily Challenge</div>
            <div class="settings-desc">Today: ${getDailyDateStr()} · same seed for every player</div>
          </div>
          <div class="settings-control">
            <button class="btn btn-ghost btn-sm" data-action="play-daily">▶ Play</button>
          </div>
        </div>

        <div class="settings-row" style="margin-top:8px;padding-top:12px;border-top:1px solid var(--border);flex-direction:column;align-items:stretch;gap:8px">
          <button class="btn btn-ghost btn-sm" data-action="show-tutorial" style="width:100%">📖 Show Tutorial</button>
          <button class="btn btn-ghost btn-sm" data-action="show-achievements" style="width:100%">🏆 Achievements (${meta.achievements.length}/${ACHIEVEMENTS.length})</button>
          <button class="btn btn-ghost btn-sm" data-action="show-hall" style="width:100%">📜 Hall of Folded Companies</button>
          <button class="btn btn-ghost btn-sm" data-action="show-credits" style="width:100%">🌌 Credits</button>
          <button class="btn btn-danger btn-sm" data-action="reset-meta" style="width:100%">⚠ Reset All Progress (lose IC & unlocks)</button>
        </div>
      </div>`;
    return;
  }

  overlay.classList.add('hidden');
}

// ============================================================
// DEBUG PANEL (M9)
// ============================================================
let _debugVisible = false;

function renderDebugPanel() {
  const panel = document.getElementById('debug-panel');
  if (!_debugVisible) { panel.classList.add('hidden'); return; }
  panel.classList.remove('hidden');

  const diff    = difficultyScale(game.turn);
  const diffLabel = diff <= 0.85 ? 'EASY' : diff <= 1.0 ? 'NORM' : diff <= 1.3 ? 'HARD' : 'BRUTAL';
  const diffColor = diff <= 0.85 ? 'var(--green)' : diff <= 1.0 ? 'var(--cyan)' : diff <= 1.3 ? 'var(--amber)' : 'var(--red)';

  panel.innerHTML = `
    <div class="dbg-title">
      🛠 DEBUG <span style="color:var(--text-dim);font-size:9px">Ctrl+D to close</span>
    </div>
    <div class="dbg-row"><span>Turn</span><strong>${game.turn}/${game.maxTurns}</strong></div>
    <div class="dbg-row"><span>Difficulty</span><strong style="color:${diffColor}">${diff.toFixed(2)}× (${diffLabel})</strong></div>
    <div class="dbg-row"><span>Capital</span><strong style="color:var(--green)">¢${fmt(game.capital)}</strong></div>
    <div class="dbg-row"><span>IPO Target</span><strong style="color:var(--amber)">¢${fmt(BALANCE.winCapital)}</strong></div>
    <div class="dbg-row"><span>Rep / Heat</span><strong>${game.reputation} / ${game.heat}</strong></div>
    <div class="dbg-row"><span>Exposure</span><strong>¢${fmt(game.exposure)}</strong></div>
    <div class="dbg-row"><span>Policies</span><strong>${game.policies.length}</strong></div>
    <div class="dbg-row"><span>Seed</span><strong style="font-size:9px">${game.seed.toString(16)}</strong></div>
    <div class="dbg-btns">
      <button class="dbg-btn" data-action="dbg-capital">+¢5k</button>
      <button class="dbg-btn" data-action="dbg-rep">+20 rep</button>
      <button class="dbg-btn" data-action="dbg-heat">-20 heat</button>
      <button class="dbg-btn" data-action="dbg-turn">skip turn</button>
      <button class="dbg-btn" data-action="dbg-win">force win</button>
      <button class="dbg-btn" data-action="dbg-bust">go bust</button>
    </div>
  `;
}

// ============================================================
// KEYBOARD SHORTCUTS (M8+M9)
// ============================================================
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const key = e.key.toLowerCase();

  if (e.ctrlKey && key === 'd') {
    e.preventDefault();
    _debugVisible = !_debugVisible;
    renderDebugPanel();
    return;
  }

  if (key === 'enter' || key === ' ') {
    if (!game.isGameOver) advancePhase();
  } else if (key === '1' || key === '2' || key === '3') {
    if (game.phase === 'events' && (game.pendingCards || []).length > 0) {
      const card = game.pendingCards[0];
      const idx  = parseInt(key, 10) - 1;
      if (idx < card.choices.length) resolveChoice(card.id, idx);
    }
  }
});

(function init() {
  // Starfield background
  const sfUri = 'data:image/svg+xml,' + encodeURIComponent(STARFIELD_SVG);
  document.body.style.backgroundImage = `url("${sfUri}")`;
  document.body.style.backgroundRepeat = 'repeat';
  document.body.style.backgroundSize   = '400px 300px';

  // Load meta-progression and settings
  loadMeta();
  loadSettings();

  if (!loadGame()) newGame();
  else render();

  // Show tutorial for first-time players
  if (settings.firstRun) showTutorial();
})();
</script>
