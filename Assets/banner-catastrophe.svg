<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 40" width="100%" height="100%">
  <defs>
    <!-- Subtle hazard-stripe diagonal pattern -->
    <pattern id="hazard" width="20" height="20" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="10" height="20" fill="#1a0000" />
      <rect x="10" width="10" height="20" fill="#260000" />
    </pattern>
  </defs>

  <!-- Background with hazard stripes -->
  <rect width="600" height="40" fill="url(#hazard)" />

  <!-- Top and Bottom glowing borders -->
  <line x1="0" y1="0.5" x2="600" y2="0.5" stroke="#ff4466" stroke-width="1.5" opacity="0.9" />
  <line x1="0" y1="39.5" x2="600" y2="39.5" stroke="#ff4466" stroke-width="1.5" opacity="0.9" />

  <!-- Left Warning Triangle Icon -->
  <g transform="translate(100, 4)">
    <polygon points="16,4 28,26 4,26" fill="#ff4466" stroke="#ff4466" stroke-width="1" stroke-linejoin="round" />
    <rect x="15" y="10" width="2" height="8" fill="#1a0000" rx="0.5" />
    <circle cx="16" cy="22" r="1.5" fill="#1a0000" />
  </g>

  <!-- Center Text -->
  <text x="300" y="26" font-family="'Courier New', Courier, monospace" font-weight="900" font-size="16" fill="#ff4466" letter-spacing="4" text-anchor="middle">⚠ CATASTROPHE ALERT ⚠</text>

  <!-- Right Warning Triangle Icon -->
  <g transform="translate(468, 4)">
    <polygon points="16,4 28,26 4,26" fill="#ff4466" stroke="#ff4466" stroke-width="1" stroke-linejoin="round" />
    <rect x="15" y="10" width="2" height="8" fill="#1a0000" rx="0.5" />
    <circle cx="16" cy="22" r="1.5" fill="#1a0000" />
  </g>
</svg>
