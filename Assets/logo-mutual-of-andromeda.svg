<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 80" width="100%" height="100%">
  <!-- Background -->
  <rect width="480" height="80" fill="#03030f" rx="8" />

  <!-- Grid/Star subtle detail behind logo (NASA retro vibe) -->
  <g opacity="0.15">
    <circle cx="50" cy="40" r="35" fill="none" stroke="#b8cce8" stroke-width="0.5" stroke-dasharray="2 3" />
    <line x1="15" y1="40" x2="85" y2="40" stroke="#b8cce8" stroke-width="0.5" stroke-dasharray="2 2" />
    <line x1="50" y1="5" x2="50" y2="75" stroke="#b8cce8" stroke-width="0.5" stroke-dasharray="2 2" />
  </g>

  <!-- Icon: Galaxy & Shield -->
  <g id="logo-icon">
    <!-- Galaxy Spiral Arms (Cyan) -->
    <!-- Arm 1 -->
    <path d="M 50 40 Q 65 30 60 15 Q 50 10 38 22 Q 26 34 35 55 Q 44 76 70 65 Q 85 55 80 40" 
          fill="none" stroke="#00ccff" stroke-width="3" stroke-linecap="round" />
    <!-- Arm 2 -->
    <path d="M 50 40 Q 35 50 40 65 Q 50 70 62 58 Q 74 46 65 25 Q 56 4 30 15 Q 15 25 20 40" 
          fill="none" stroke="#00ccff" stroke-width="3" stroke-linecap="round" opacity="0.75" />

    <!-- Center Shield (Gold with Bevel) -->
    <g id="shield">
      <!-- Shield Shadow/Glow -->
      <path d="M 50 31 L 60 34 V 43 C 60 49.5, 50 54, 50 54 C 50 54, 40 49.5, 40 43 V 34 Z" 
            fill="#ffcc44" opacity="0.2" filter="blur(2px)" />
      <!-- Left side (Base Gold) -->
      <path d="M 50 32 L 41 34.5 V 42.5 C 41 48.5, 50 52.5, 50 52.5 Z" 
            fill="#ffcc44" stroke="#03030f" stroke-width="1" stroke-linejoin="round" />
      <!-- Right side (Shaded Gold) -->
      <path d="M 50 32 L 59 34.5 V 42.5 C 59 48.5, 50 52.5, 50 52.5 Z" 
            fill="#e6b83c" stroke="#03030f" stroke-width="1" stroke-linejoin="round" />
      <!-- Shield highlight details -->
      <path d="M 44 37 L 44 42" stroke="#ffffff" stroke-width="0.75" opacity="0.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Divider Line -->
  <line x1="95" y1="20" x2="95" y2="60" stroke="#b8cce8" stroke-width="1" opacity="0.2" />

  <!-- Text Lockup -->
  <!-- EST. 2301 -->
  <text x="115" y="32" 
        font-family="'Courier New', Courier, monospace" 
        font-size="10" 
        font-weight="bold" 
        letter-spacing="5" 
        fill="#ffcc44" 
        opacity="0.9">EST. 2301</text>

  <!-- MUTUAL OF ANDROMEDA -->
  <text x="115" y="56" 
        font-family="'Trebuchet MS', 'Helvetica Neue', Arial, sans-serif" 
        font-size="21" 
        font-weight="900" 
        letter-spacing="6" 
        fill="#b8cce8">MUTUAL OF ANDROMEDA</text>

  <!-- Subtitle / Motto undertext -->
  <text x="115" y="67" 
        font-family="'Courier New', Courier, monospace" 
        font-size="7" 
        letter-spacing="2" 
        fill="#00ccff" 
        opacity="0.6">GALACTIC ACTUARIAL &amp; UNDERWRITING DIVISION</text>
</svg>
