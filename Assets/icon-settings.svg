<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="100%" height="100%">
  <defs>
    <!-- One tooth of the 6-tooth gear -->
    <polygon id="tooth" points="10.8,1.5 13.2,1.5 14.1,4.5 9.9,4.5" />
  </defs>

  <!-- Gear Group -->
  <g fill="#6688aa" fill-rule="evenodd">
    <!-- Central Ring with Cutout -->
    <path d="M 12 4.2 A 7.8 7.8 0 1 0 12 19.8 A 7.8 7.8 0 1 0 12 4.2 Z M 12 8.8 A 3.2 3.2 0 1 1 12 15.2 A 3.2 3.2 0 1 1 12 8.8 Z" />
    
    <!-- 6 Teeth -->
    <use href="#tooth" transform="rotate(0 12 12)" />
    <use href="#tooth" transform="rotate(60 12 12)" />
    <use href="#tooth" transform="rotate(120 12 12)" />
    <use href="#tooth" transform="rotate(180 12 12)" />
    <use href="#tooth" transform="rotate(240 12 12)" />
    <use href="#tooth" transform="rotate(300 12 12)" />
  </g>
</svg>
