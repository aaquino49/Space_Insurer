<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <!-- Icon Background -->
  <rect width="48" height="48" fill="#080820" rx="10" stroke="#ffaa00" stroke-width="1" opacity="0.3" />
  <rect width="48" height="48" fill="none" rx="10" stroke="#ffaa00" stroke-width="0.5" opacity="0.1" />

  <!-- Stars / Background details -->
  <circle cx="11" cy="11" r="1" fill="#ffaa00" opacity="0.8" />
  <circle cx="38" cy="14" r="0.75" fill="#ffaa00" opacity="0.5" />
  <polygon points="36,28 37.5,29 36,30 34.5,29" fill="#ffaa00" opacity="0.7" />

  <!-- The Planet -->
  <circle cx="24" cy="31" r="11" fill="none" stroke="#ffaa00" stroke-width="2" />
  <!-- Planet Ring / Crater detail (tilted) -->
  <path d="M 13.5 32.5 C 16 35.5, 32 35.5, 34.5 32.5" fill="none" stroke="#ffaa00" stroke-width="1.2" stroke-linecap="round" />
  <path d="M 13.5 31.5 C 16 29.5, 32 29.5, 34.5 31.5" fill="none" stroke="#ffaa00" stroke-width="0.75" stroke-dasharray="1.5 1.5" opacity="0.7" />

  <!-- The Dome Colony -->
  <!-- Base platform of the dome -->
  <line x1="15" y1="20.5" x2="33" y2="20.5" stroke="#ffaa00" stroke-width="2" stroke-linecap="round" />
  <!-- Dome Outline -->
  <path d="M 16 20.5 A 8 8 0 0 1 32 20.5 Z" fill="#ffaa00" fill-opacity="0.15" stroke="#ffaa00" stroke-width="2" stroke-linejoin="round" />
  <!-- Geodesic Dome Grid lines -->
  <path d="M 20 13 A 8 8 0 0 0 20 20.5" fill="none" stroke="#ffaa00" stroke-width="0.75" opacity="0.6" />
  <path d="M 28 13 A 8 8 0 0 1 28 20.5" fill="none" stroke="#ffaa00" stroke-width="0.75" opacity="0.6" />
  <line x1="24" y1="12.5" x2="24" y2="20.5" stroke="#ffaa00" stroke-width="0.75" opacity="0.6" />
  <path d="M 16.5 17 H 31.5" fill="none" stroke="#ffaa00" stroke-width="0.75" opacity="0.6" />

  <!-- Tiny building silhouette inside -->
  <rect x="22" y="16" width="4" height="4.5" fill="#ffaa00" />
  <line x1="24" y1="14" x2="24" y2="16" stroke="#ffaa00" stroke-width="1" />
</svg>
