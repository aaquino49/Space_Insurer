<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="100%" height="100%">
  <!-- Background -->
  <rect width="36" height="36" fill="#080820" rx="8" stroke="#ff4466" stroke-width="1" opacity="0.3" />
  
  <!-- Outer Shield (Cracked) -->
  <g>
    <!-- Left side of shield -->
    <path d="M 18 7 L 9 9.5 V 17 C 9 21, 13.5 23.5, 18 26 Z" fill="none" stroke="#ff4466" stroke-width="2" stroke-linejoin="round" />
    <!-- Right side of shield -->
    <path d="M 18 7 L 27 9.5 V 17 C 27 21, 22.5 23.5, 18 26 Z" fill="none" stroke="#ff4466" stroke-width="2" stroke-linejoin="round" />
  </g>

  <!-- Dollar Sign Cracks -->
  <!-- Vertical Bar -->
  <path d="M 18 9.5 V 23.5" fill="none" stroke="#ff4466" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="4 2 3 1" />
  <!-- S shape in the center, stylized with jagged lines -->
  <path d="M 21.5 12.5 L 18 13.5 L 15.5 14 L 15.5 16 L 18 17 L 20.5 17.5 L 20.5 19.5 L 18 20.5 L 14.5 21.5" 
        fill="none" stroke="#ff4466" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Radiating Cracks -->
  <path d="M 15.5 14 L 11 13" stroke="#ff4466" stroke-width="1" stroke-linecap="round" />
  <path d="M 20.5 17.5 L 25 19" stroke="#ff4466" stroke-width="1" stroke-linecap="round" />
  <path d="M 18 17 L 13.5 20.5" stroke="#ff4466" stroke-width="1" stroke-linecap="round" />
  <path d="M 18 13.5 L 23 11" stroke="#ff4466" stroke-width="1" stroke-linecap="round" />
</svg>
