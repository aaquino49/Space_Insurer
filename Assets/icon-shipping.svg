<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <!-- Icon Background -->
  <rect width="48" height="48" fill="#080820" rx="10" stroke="#00e87a" stroke-width="1" opacity="0.3" />
  <rect width="48" height="48" fill="none" rx="10" stroke="#00e87a" stroke-width="0.5" opacity="0.1" />

  <!-- Speed lines (background details for flight) -->
  <line x1="4" y1="14" x2="8" y2="14" stroke="#00e87a" stroke-width="1" stroke-linecap="round" opacity="0.4" />
  <line x1="36" y1="12" x2="42" y2="12" stroke="#00e87a" stroke-width="1" stroke-linecap="round" opacity="0.5" />
  <line x1="38" y1="36" x2="43" y2="36" stroke="#00e87a" stroke-width="1" stroke-linecap="round" opacity="0.3" />
  <line x1="6" y1="32" x2="11" y2="32" stroke="#00e87a" stroke-width="1" stroke-linecap="round" opacity="0.4" />

  <!-- The Freighter -->
  <!-- Engine Thruster bells at rear -->
  <rect x="10" y="21" width="3" height="6" rx="0.5" fill="#00e87a" stroke="#080820" stroke-width="0.5" />
  <rect x="9" y="16" width="3" height="4" rx="0.5" fill="#00e87a" opacity="0.8" />
  <rect x="9" y="28" width="3" height="4" rx="0.5" fill="#00e87a" opacity="0.8" />

  <!-- Engine Exhaust Plumes / Thruster fire -->
  <path d="M 9 18 L 3 18" stroke="#00e87a" stroke-width="1" stroke-linecap="round" opacity="0.7" />
  <path d="M 9 30 L 3 30" stroke="#00e87a" stroke-width="1" stroke-linecap="round" opacity="0.7" />
  <path d="M 10 24 L 2 24" stroke="#00e87a" stroke-width="2.5" stroke-linecap="round" />
  <path d="M 5 24 L 1 24" stroke="#ffffff" stroke-width="1" stroke-linecap="round" />

  <!-- Main Cargo Bay/Containers (Blocky) -->
  <!-- Container 1 -->
  <rect x="13" y="15" width="8" height="18" rx="1.5" fill="#080820" stroke="#00e87a" stroke-width="2" />
  <line x1="17" y1="15" x2="17" y2="33" stroke="#00e87a" stroke-width="0.75" />
  
  <!-- Container 2 -->
  <rect x="21" y="15" width="8" height="18" rx="1.5" fill="#080820" stroke="#00e87a" stroke-width="2" />
  <line x1="25" y1="15" x2="25" y2="33" stroke="#00e87a" stroke-width="0.75" />

  <!-- Connector frame/spine -->
  <rect x="29" y="20" width="3" height="8" fill="#00e87a" />

  <!-- Cockpit / Command Cabin (Front) -->
  <path d="M 32 17 L 39 20 C 41 21, 41 27, 39 28 L 32 31 Z" fill="#080820" stroke="#00e87a" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Cockpit Window -->
  <path d="M 35 19 L 38 21 L 38 23 L 35 23 Z" fill="#00e87a" />
</svg>
