    <circle cx="325" cy="115" r="0.4" opacity="0.3" />
    <circle cx="345" cy="45" r="0.4" opacity="0.5" />
    <circle cx="375" cy="215" r="0.4" opacity="0.4" />
    <circle cx="385" cy="135" r="0.4" opacity="0.3" />
