<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <!-- Seamless Background color -->
  <rect width="400" height="300" fill="#03030f" />

  <!-- DUST NEBULAE / DISTANT GALAXIES (Faint soft blobs, opacity ~0.02 - 0.04) -->
  <!-- Cyan Nebula -->
  <ellipse cx="120" cy="180" rx="70" ry="35" fill="#00ccff" opacity="0.03" transform="rotate(-20 120 180)" filter="blur(10px)" />
  <!-- Purple Nebula -->
  <ellipse cx="280" cy="90" rx="85" ry="40" fill="#bb66ff" opacity="0.025" transform="rotate(15 280 90)" filter="blur(12px)" />
  <!-- Warm Core/Dust Cloud -->
  <ellipse cx="210" cy="140" rx="60" ry="50" fill="#ffaa00" opacity="0.015" transform="rotate(45 210 140)" filter="blur(15px)" />

  <!-- STARFIELD (80 Scattered stars, kept away from edges to ensure seamless tiling) -->
