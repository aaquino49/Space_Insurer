<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <!-- Icon Background -->
  <rect width="48" height="48" fill="#080820" rx="10" stroke="#ffcc44" stroke-width="1" opacity="0.3" />
  <rect width="48" height="48" fill="none" rx="10" stroke="#ffcc44" stroke-width="0.5" opacity="0.1" />

  <!-- Stars / Background details -->
  <circle cx="11" cy="11" r="1" fill="#ffcc44" opacity="0.8" />
  <circle cx="38" cy="36" r="0.75" fill="#ffcc44" opacity="0.5" />
  <polygon points="36,12 37.5,13 36,14 34.5,13" fill="#ffcc44" opacity="0.7" />

  <!-- Umbrella Handle / Shaft (Drawn behind the planet) -->
  <path d="M 24 22 L 24 37 C 24 39, 21 39, 21 37" fill="none" stroke="#ffcc44" stroke-width="1.5" stroke-linecap="round" />

  <!-- The Planet -->
  <circle cx="24" cy="30" r="6" fill="#080820" stroke="#ffcc44" stroke-width="1.5" />
  
  <!-- Planet Ring (3D effect: front and back halves) -->
  <!-- Back ring -->
  <path d="M 14 29.5 C 16.5 27.5, 31.5 27.5, 34 29.5" fill="none" stroke="#ffcc44" stroke-width="0.75" stroke-dasharray="1.5 1.5" opacity="0.7" />
  <!-- Front ring -->
  <path d="M 14 30.5 C 16.5 33.5, 31.5 33.5, 34 30.5" fill="none" stroke="#ffcc44" stroke-width="1.2" stroke-linecap="round" />

  <!-- Umbrella Canopy (Drawn on top) -->
  <path d="M 9 23 C 9 11, 39 11, 39 23 C 34 21, 29 21, 24 23 C 19 21, 14 21, 9 23 Z" fill="#ffcc44" fill-opacity="0.15" stroke="#ffcc44" stroke-width="2" stroke-linejoin="round" />
  
  <!-- Umbrella Ribs -->
  <path d="M 24 11 C 24 16, 24 23, 24 23" fill="none" stroke="#ffcc44" stroke-width="0.75" opacity="0.6" />
  <path d="M 24 11 C 20 16, 17 20, 16.5 21.7" fill="none" stroke="#ffcc44" stroke-width="0.75" opacity="0.6" />
  <path d="M 24 11 C 28 16, 31 20, 31.5 21.7" fill="none" stroke="#ffcc44" stroke-width="0.75" opacity="0.6" />
  
  <!-- Umbrella Top Tip -->
  <line x1="24" y1="8" x2="24" y2="11" stroke="#ffcc44" stroke-width="2" stroke-linecap="round" />
</svg>
