  <polygon points="18,8.5 20.5,15.5 27.5,18 20.5,20.5 18,27.5 15.5,20.5 8.5,18 15.5,15.5" fill="#ffcc44" fill-opacity="0.2" stroke="#ffcc44" stroke-width="1.2" stroke-linejoin="round" />

  <!-- "IC" Monospace text -->
  <text x="18" y="21.5" font-family="'Courier New', Courier, monospace" font-weight="900" font-size="10" fill="#ffcc44" text-anchor="middle" letter-spacing="0.5">IC</text>
</svg>
