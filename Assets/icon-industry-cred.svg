<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="100%" height="100%">
  <!-- Background -->
  <rect width="36" height="36" fill="#080820" rx="8" stroke="#ffcc44" stroke-width="1" opacity="0.3" />

  <!-- Tiny Background Galaxy Spiral (Cyan) -->
  <path d="M 18 18 M 13 16 C 13 11, 23 10, 25 14 C 27 18, 21 24, 15 24 C 11 24, 9 20, 11 16" fill="none" stroke="#00ccff" stroke-width="1" opacity="0.35" stroke-linecap="round" />
  <circle cx="28" cy="8" r="0.75" fill="#00ccff" opacity="0.6" />
  <circle cx="8" cy="28" r="0.75" fill="#00ccff" opacity="0.6" />

  <!-- Retro Space Swoosh Ribbon (Cyan) -->
  <path d="M 8 23 C 8 13, 25 11, 28 15 C 30 18, 22 23, 11 25" fill="none" stroke="#00ccff" stroke-width="1.5" stroke-linecap="round" opacity="0.85" />

  <!-- Circular Gold Medal Frame -->
  <circle cx="18" cy="18" r="11" fill="#080820" fill-opacity="0.3" stroke="#ffcc44" stroke-width="1.8" />
  <circle cx="18" cy="18" r="9" fill="none" stroke="#00ccff" stroke-width="0.5" opacity="0.5" />

