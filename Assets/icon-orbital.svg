<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="100%" height="100%">
  <!-- Icon Background -->
  <rect width="48" height="48" fill="#080820" rx="10" stroke="#00ccff" stroke-width="1" opacity="0.3" />
  <rect width="48" height="48" fill="none" rx="10" stroke="#00ccff" stroke-width="0.5" opacity="0.1" />

  <!-- Background stars -->
  <polygon points="12,14 13,15 12,16 11,15" fill="#00ccff" opacity="0.5" />
  <circle cx="38" cy="35" r="0.75" fill="#00ccff" opacity="0.8" />
  <circle cx="10" cy="34" r="1" fill="#00ccff" opacity="0.4" />

  <!-- Solar Panel Main Shaft (Vertical) -->
  <line x1="24" y1="8" x2="24" y2="40" stroke="#00ccff" stroke-width="2" stroke-linecap="round" />

  <!-- Space Station Torus (Tilted) -->
  <ellipse cx="24" cy="24" rx="13" ry="6" fill="#080820" stroke="#00ccff" stroke-width="2.5" />
  <!-- Inside of torus (gives hollow look) -->
  <ellipse cx="24" cy="24" rx="8" ry="3" fill="#080820" stroke="#00ccff" stroke-width="1.5" opacity="0.8" />

  <!-- Connection Spokes -->
  <line x1="11" y1="24" x2="16" y2="24" stroke="#00ccff" stroke-width="1.5" />
  <line x1="32" y1="24" x2="37" y2="24" stroke="#00ccff" stroke-width="1.5" />
  <line x1="24" y1="18" x2="24" y2="21" stroke="#00ccff" stroke-width="1.5" />
  <line x1="24" y1="27" x2="24" y2="30" stroke="#00ccff" stroke-width="1.5" />

  <!-- Central Hub -->
  <circle cx="24" cy="24" r="3.5" fill="#00ccff" stroke="#080820" stroke-width="0.75" />

  <!-- Top Solar Panel -->
  <g transform="translate(14, 5)">
    <rect width="20" height="6" rx="1" fill="#080820" stroke="#00ccff" stroke-width="1.5" />
    <line x1="5" y1="0" x2="5" y2="6" stroke="#00ccff" stroke-width="0.75" />
    <line x1="10" y1="0" x2="10" y2="6" stroke="#00ccff" stroke-width="1" />
    <line x1="15" y1="0" x2="15" y2="6" stroke="#00ccff" stroke-width="0.75" />
  </g>

  <!-- Bottom Solar Panel -->
  <g transform="translate(14, 37)">
    <rect width="20" height="6" rx="1" fill="#080820" stroke="#00ccff" stroke-width="1.5" />
    <line x1="5" y1="0" x2="5" y2="6" stroke="#00ccff" stroke-width="0.75" />
    <line x1="10" y1="0" x2="10" y2="6" stroke="#00ccff" stroke-width="1" />
    <line x1="15" y1="0" x2="15" y2="6" stroke="#00ccff" stroke-width="0.75" />
  </g>
</svg>
