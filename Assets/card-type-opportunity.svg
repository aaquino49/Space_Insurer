<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="100%" height="100%">
  <!-- Background -->
  <rect width="36" height="36" fill="#080820" rx="8" stroke="#00e87a" stroke-width="1" opacity="0.3" />

  <!-- Speed Trails / Comet Tail (Fading) -->
  <line x1="6" y1="25" x2="13" y2="18" stroke="#00e87a" stroke-width="1" stroke-linecap="round" opacity="0.4" />
  <line x1="11" y1="30" x2="19" y2="22" stroke="#00e87a" stroke-width="1" stroke-linecap="round" opacity="0.6" />
  <line x1="16" y1="32" x2="21" y2="27" stroke="#00e87a" stroke-width="1.2" stroke-linecap="round" opacity="0.4" />
  <line x1="5" y1="20" x2="10" y2="15" stroke="#00e87a" stroke-width="1" stroke-linecap="round" opacity="0.3" />

  <!-- Upward Arrow Shaft and Head (Green, dynamic) -->
  <g>
    <!-- Shaft -->
    <line x1="8" y1="28" x2="21" y2="15" stroke="#00e87a" stroke-width="2.5" stroke-linecap="round" />
    <!-- Arrowhead pointing to top-right -->
    <path d="M 15 15 H 21 V 21" fill="none" stroke="#00e87a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Glowing Star at the Arrow Tip -->
  <g id="sparkle">
    <!-- Star fill -->
    <path d="M 28 3 L 30.2 7.8 L 35 10 L 30.2 12.2 L 28 17 L 25.8 12.2 L 21 10 L 25.8 7.8 Z" fill="#00e87a" />
    <!-- Center white core for retro highlight -->
    <circle cx="28" cy="10" r="1" fill="#ffffff" />
  </g>

  <!-- Little ambient sparkles -->
  <polygon points="12,10 13,11 12,12 11,11" fill="#00e87a" opacity="0.6" />
  <polygon points="27,25 28,26 27,27 26,26" fill="#00e87a" opacity="0.5" />
</svg>
