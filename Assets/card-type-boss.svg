<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 36 36" width="100%" height="100%">
  <!-- Definition of the requested red-to-gold gradient -->
  <defs>
    <linearGradient id="boss-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4466" />
      <stop offset="100%" stop-color="#ffcc44" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="36" height="36" fill="#080820" rx="8" stroke="url(#boss-grad)" stroke-width="1" opacity="0.3" />

  <!-- The Boss: Skull + Corporate Tie -->
  <g>
    <!-- Skull Cranium -->
    <path d="M 11 16 C 11 9.5, 25 9.5, 25 16 C 25 19, 23 20, 22.5 22.5 H 13.5 C 13 20, 11 19, 11 16 Z" 
          fill="url(#boss-grad)" />

    <!-- Angled, angry "Manager" eye sockets -->
    <path d="M 13.5 13.5 L 17 15 L 16 16.5 L 13.5 15.5 Z" fill="#080820" />
    <path d="M 22.5 13.5 L 19 15 L 20 16.5 L 22.5 15.5 Z" fill="#080820" />

    <!-- Nose Cavity -->
    <polygon points="18,17.5 16.5,19.5 19.5,19.5" fill="#080820" />

    <!-- Teeth / Jaw lines -->
    <line x1="14.5" y1="21" x2="21.5" y2="21" stroke="#080820" stroke-width="1" />
    <line x1="16" y1="20" x2="16" y2="22" stroke="#080820" stroke-width="0.8" />
    <line x1="18" y1="20" x2="18" y2="22" stroke="#080820" stroke-width="0.8" />
    <line x1="20" y1="20" x2="20" y2="22" stroke="#080820" stroke-width="0.8" />

    <!-- Corporate Tie -->
    <!-- Shirt Collar (Behind Tie) -->
    <polygon points="13.5,22.5 18,25 22.5,22.5 18,22.5" fill="#080820" stroke="url(#boss-grad)" stroke-width="1" />
    
    <!-- Tie Knot -->
    <polygon points="16.5,22.5 19.5,22.5 18,25" fill="url(#boss-grad)" stroke="#080820" stroke-width="0.5" />
    
    <!-- Tie Tail (pointing down) -->
    <polygon points="17.2,25 18.8,25 20,31.5 18,33.5 16,31.5" fill="url(#boss-grad)" stroke="#080820" stroke-width="0.5" />
    
    <!-- Tie stripes (subtle corporate pattern) -->
    <line x1="17" y1="27" x2="19.2" y2="28" stroke="#080820" stroke-width="0.75" opacity="0.6" />
    <line x1="16.5" y1="29.5" x2="19.7" y2="30.5" stroke="#080820" stroke-width="0.75" opacity="0.6" />
  </g>
</svg>
